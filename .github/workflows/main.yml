name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          # Usando um link que força o download do arquivo real
          curl -L "https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz" -o $THEOS/sdks/sdk.tar.xz
          tar -xf $THEOS/sdks/sdk.tar.xz -C $THEOS/sdks
          
      - name: Build Dylib
        run: |
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1
          
      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SensiInjetor-Dylib
          path: .theos/obj/arm64/*.dylib
