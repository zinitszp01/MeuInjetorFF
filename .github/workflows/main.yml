name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          # Baixando um SDK mais estável e garantindo o download
          curl -ksL https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz -o $THEOS/sdks/iPhoneOS14.5.sdk.tar.xz
          cd $THEOS/sdks
          tar -xf iPhoneOS14.5.sdk.tar.xz
          rm iPhoneOS14.5.sdk.tar.xz
      - name: Build Dylib
        run: |
          export THEOS=~/theos
          make FINALPACKAGE=1
      - name: Check File
        run: ls -R .theos/ # Isso nos ajuda a ver se o arquivo foi criado
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: MinhaDylib
          path: .theos/obj/**/*.dylib
