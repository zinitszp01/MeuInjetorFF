name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz
          mkdir -p $THEOS/sdks
          tar -xJ -C $THEOS/sdks -f iPhoneOS14.5.sdk.tar.xz
      - name: Build Dylib
        run: |
          export THEOS=~/theos
          make FINALPACKAGE=1
      - name: Upload Result
        uses: actions/upload-artifact@v3
        with:
          name: MinhaDylib
          path: .theos/obj/debug/*.dylib
